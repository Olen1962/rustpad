[package]
name = "rustpad"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
